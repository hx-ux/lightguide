name = "lightguide_rust"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "backend",
    "cli", "rest_api",
    "ui"
]
resolver = "3"

[workspace.package]
version = "0.0.0"
readme = "README.md"


[workspace.dependencies]
harmonia = "0.1.0"
hidapi = "2.6.6"
serde = "1.0.229"
serde_json = "1.0"


[profile.release]
strip = true
lto = true

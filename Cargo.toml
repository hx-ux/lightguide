[workspace]
members = [
    "backend",
    "cli",
    "ui"
]
resolver = "3"

[workspace.package]
version = "0.0.0"
readme = "README.md"


[workspace.dependencies]
harmonia = "0.1.0"
hidapi = "2.6.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"


[profile.release]
strip = true
lto = true
